  var CH = "radici.k";   // chiave derivata (non la password) salvata se si sceglie "ricordami"

  function da64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function a64(u8) { var s = ""; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function msg(t) { var m = document.getElementById("msg"); if (m) m.textContent = t; }

  // decifra con la chiave grezza (32 byte) e sostituisce la pagina
  async function apri(raw) {
    var chiave = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var chiaro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: da64(D.v) }, chiave, da64(D.c));
    document.body.innerHTML = new TextDecoder().decode(chiaro);
    if (location.hash) {
      var el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el) el.scrollIntoView();
    }
  }

  async function derivaChiave(password) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", hash: "SHA-256", salt: da64(D.s), iterations: D.i }, base, 256);
    return new Uint8Array(bits);
  }

  if (!window.crypto || !crypto.subtle) {
    msg("Questo browser non supporta la cifratura necessaria (serve una pagina https).");
  }

  // chiave già ricordata? prova ad aprire subito; se non vale più (pagina rigenerata) la butta
  (async function () {
    try {
      var k = localStorage.getItem(CH);
      if (!k) return;
      try { await apri(da64(k)); }
      catch (e) { try { localStorage.removeItem(CH); } catch (e2) {} }
    } catch (e) {}
  })();

  document.getElementById("guscio").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var pw = document.getElementById("pw").value;
    var ric = document.getElementById("ric").checked;
    msg("");
    if (!pw) return;
    try {
      var raw = await derivaChiave(pw);
      await apri(raw);                       // password sbagliata: qui lancia
      if (ric) { try { localStorage.setItem(CH, a64(raw)); } catch (e) {} }
    } catch (e) {
      msg("Password sbagliata");
    }
  });
})();
