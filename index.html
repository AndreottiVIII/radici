:root{--bg:#fbfaf3;--quad:rgba(70,115,190,.17);--margine:rgba(214,64,64,.5);--grafite:#3d3d42;--txt:#26262b;--sub:#5d5d66;--rosso:#d2352b;--evid:rgba(255,220,40,.62);--foglio:#fffef9}
@media (prefers-color-scheme:dark){:root{--bg:#1b1f28;--quad:rgba(150,180,235,.11);--margine:rgba(240,110,110,.38);--grafite:#c9c9d0;--txt:#efeee7;--sub:#a9a9b3;--rosso:#ff7b6f;--evid:rgba(255,213,74,.26);--foglio:#20252f}}
html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--txt);font:18px/1.5 "QuadernoG","Patrick Hand","Segoe Print","Bradley Hand","Noteworthy","Comic Sans MS",cursive}
#g-carta{position:fixed;inset:0;z-index:-1;pointer-events:none;background-color:var(--bg);--mx:18px;
background-image:linear-gradient(90deg,transparent calc(var(--mx) - 1px),var(--margine) calc(var(--mx) - 1px),var(--margine) calc(var(--mx) + .7px),transparent calc(var(--mx) + .7px)),linear-gradient(var(--quad) 1px,transparent 1px),linear-gradient(90deg,var(--quad) 1px,transparent 1px);
background-size:100% 100%,22px 22px,22px 22px}
@media (min-width:900px){#g-carta{--mx:62px}}
#guscio{max-width:22rem;margin:16vh auto 0;padding:0 1.2rem 0 2.6rem}
#guscio h1{display:table;position:relative;z-index:0;margin:0 0 1.1rem;font-size:56px;line-height:1.1;font-weight:400}
#guscio h1::after{content:"";position:absolute;left:-8px;right:-12px;bottom:6px;height:22px;background:var(--evid);z-index:-1;border-radius:3px 8px 4px 9px;transform:rotate(-1.5deg)}
#guscio label{color:var(--sub)}
#guscio input[type=password]{display:block;width:100%;font:inherit;font-size:18px;padding:.5rem .8rem;margin:.3rem 0 .9rem;border:2px solid var(--grafite);
border-radius:255px 15px 225px 15px/15px 225px 15px 255px;background:var(--foglio);color:inherit;box-shadow:2px 3px 0 rgba(0,0,0,.08)}
#guscio input[type=password]:focus{outline:2px dashed var(--rosso);outline-offset:3px}
#guscio label.r{display:block;margin:0 0 1.1rem;color:var(--txt)}
#guscio input[type=checkbox]{width:18px;height:18px;margin:0 .4rem 0 0;vertical-align:-3px;accent-color:var(--rosso)}
#guscio button{font:inherit;font-size:19px;font-weight:700;padding:.35rem 1.7rem;border:2px solid var(--rosso);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
background:var(--foglio);color:var(--rosso);cursor:pointer;box-shadow:2px 3px 0 rgba(0,0,0,.08)}
#guscio button:hover,#guscio button:focus-visible{background:var(--evid)}
#msg{color:var(--rosso);min-height:1.5em;margin-top:.8rem}
</style>
</head>
<body>
<div id="g-carta" aria-hidden="true"></div>
<form id="guscio">
<h1>Radici</h1>
<label for="pw">Password</label>
<input id="pw" type="password" autocomplete="current-password" autofocus>
<label class="r"><input id="ric" type="checkbox"> ricordami su questo dispositivo</label>
<button type="submit">Apri</button>
<div id="msg" role="alert"></div>
</form>

  function da64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function a64(u8) { var s = ""; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function msg(t) { var m = document.getElementById("msg"); if (m) m.textContent = t; }

  // decifra con la chiave grezza (32 byte) e sostituisce la pagina
  async function apri(raw) {
    var chiave = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var chiaro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: da64(D.v) }, chiave, da64(D.c));
    document.body.innerHTML = new TextDecoder().decode(chiaro);
    // gli <script> inseriti con innerHTML non partono: li ricrea uguali, così vengono eseguiti
    Array.prototype.forEach.call(document.body.querySelectorAll("script"), function (vecchio) {
      var s = document.createElement("script");
      s.textContent = vecchio.textContent;
      vecchio.parentNode.replaceChild(s, vecchio);
    });
    if (location.hash) {
      var el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el) el.scrollIntoView();
    }
  }

  async function derivaChiave(password) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", hash: "SHA-256", salt: da64(D.s), iterations: D.i }, base, 256);
    return new Uint8Array(bits);
  }

  if (!window.crypto || !crypto.subtle) {
    msg("Questo browser non supporta la cifratura necessaria (serve una pagina https).");
  }

  // chiave già ricordata? prova ad aprire subito; se non vale più (pagina rigenerata) la butta
  (async function () {
    try {
      var k = localStorage.getItem(CH);
      if (!k) return;
      try { await apri(da64(k)); }
      catch (e) { try { localStorage.removeItem(CH); } catch (e2) {} }
    } catch (e) {}
  })();

  document.getElementById("guscio").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var pw = document.getElementById("pw").value;
    var ric = document.getElementById("ric").checked;
    msg("");
    if (!pw) return;
    try {
      var raw = await derivaChiave(pw);
      await apri(raw);                       // password sbagliata: qui lancia
      if (ric) { try { localStorage.setItem(CH, a64(raw)); } catch (e) {} }
    } catch (e) {
      msg("Password sbagliata");
    }
  });
})();
